name: Build und Deploy auf GitHub Pages

on:
  # Wird ausgeführt, wenn etwas auf main landet (z. B. durch einen gemergten Pull Request)
  push:
    branches: [main]
    tags: ["v*"]
  # Manueller Start von einem beliebigen Branch (Actions-Tab -> "Run workflow")
  workflow_dispatch:

# Rechte, die für das Deployment auf GitHub Pages nötig sind
permissions:
  contents: read
  pages: write
  id-token: write

# Pro Branch/Ref nur ein Deployment gleichzeitig; laufende Deployments nicht abbrechen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Version und Commit ermitteln
        run: |
          echo "GIT_COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "APP_VERSION=$(git describe --tags --always)" >> $GITHUB_ENV

      - name: Anwendung bauen
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Pages konfigurieren
        uses: actions/configure-pages@v6

      - name: Build-Artefakt hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v5
